<div class="calendar-page">

  <!-- 上方導覽列 -->
  <app-topbar></app-topbar>

  <!-- 上方標題與操作區 -->
  <section class="calendar-header-card">

    <!-- 左側：標題 -->
    <div class="calendar-title">
      <div class="title-icon">
        📅
      </div>

      <div>
        <h2>家庭行事曆</h2>
        <p>管理家庭活動、提醒與重要日期</p>
      </div>
    </div>

    <!-- 右側：群組選擇 + 新增活動 -->
    <div class="calendar-actions">

      <!-- 群組下拉選單 -->
      <mat-form-field appearance="outline" class="calendar-group-select">
        <mat-label>選擇群組</mat-label>

        <mat-select
          [(ngModel)]="selectedGroupId"
          (selectionChange)="onGroupChange($event)"
        >
          @for (group of userGroupList; track group.groupId) {
            <mat-option [value]="group.groupId">
              👥 {{ group.groupName }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <!-- 新增活動按鈕 -->
      <button
        type="button"
        class="add-btn"
        (click)="createCalendarEvent()"
      >
        <mat-icon>add</mat-icon>
        新增活動
      </button>

    </div>

  </section>

  <!-- FullCalendar 主卡片 -->
  <section class="calendar-main-card">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </section>

</div>
