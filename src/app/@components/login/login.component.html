<section class="auth-page">
  <!-- 左側圖片區 -->
  <div class="brand-section">
    <img
      class="auth-hero-img"
      src="images/auth-hero.png"
      alt="家庭生活到期管家介紹圖"
    />
  </div>

  <!-- 右側登入表單 -->
  <form class="auth-card login-card" (ngSubmit)="signIn()">
    <div class="form-icon login-icon">
      <mat-icon>login</mat-icon>
    </div>

    <h1>登入</h1>
    <p class="subtitle">歡迎回來！請輸入您的帳號密碼</p>

    <label class="form-label">
      Email
      <div class="input-box">
        <mat-icon>mail</mat-icon>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="請輸入 Email"
          required
        />
      </div>
    </label>

    <label class="form-label">
      密碼
      <div class="input-box">
        <mat-icon>lock</mat-icon>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="請輸入密碼"
          required
        />
      </div>
    </label>

    <div class="option-row">
      <label class="remember-box">
        <input type="checkbox" checked />
        <span>記住我</span>
      </label>

      <a href="javascript:void(0)">忘記密碼？</a>
    </div>

    @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
    }

    <button type="submit" class="login-btn">登入</button>

    <p class="switch-text">
      還沒有帳號？
      <a class="register-link" [routerLink]="['/register']">立即註冊</a>
    </p>
  </form>
</section>
