<section class="login-page">
  <form class="login-panel" (ngSubmit)="signIn()">
    <div>
      <p class="eyebrow">Family Life</p>
      <h1>登入</h1>
    </div>

    <label>
      Email
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
      />
    </label>

    <label>
      密碼
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </label>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }

    <a class="register-link" [routerLink]="['/register']">
      註冊
    </a>

    <button type="submit">登入</button>
  </form>



</section>
