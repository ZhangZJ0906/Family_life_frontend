<section class="login-page">
  <form class="login-panel" (ngSubmit)="signIn()">

    <div>
      <p class="eyebrow">Family Life</p>
      <h1>登入</h1>
    </div>

    <!-- Email -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" [(ngModel)]="email" required />
    </mat-form-field>

    <!-- Password -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>密碼</mat-label>

      <input matInput [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" required />

      <!-- 👁 icon -->
      <button mat-icon-button matSuffix type="button" (click)="togglePassword()">
        <mat-icon>
          {{ showPassword ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </button>
    </mat-form-field>

    @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
    }

    <a class="register-link" [routerLink]="['/register']">
      註冊
    </a>

    <button mat-raised-button color="primary" type="submit">
      登入
    </button>

  </form>
</section>
