<h2 mat-dialog-title class="fw-bold text-primary">📦 {{ data.title }}</h2>

<mat-dialog-content>
  <div class="container-fluid pt-2">
    <div class="row g-3">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>物品名稱</mat-label>
          <input matInput [(ngModel)]="item.name" required placeholder="例如：全脂牛奶">
        </mat-form-field>
      </div>

      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>所屬群組</mat-label>
          <mat-select required [(ngModel)]="item.groupId">
            @for (g of groupId; track $index) {
            <mat-option [value]="g">{{g}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>分類</mat-label>
          <mat-select required [(ngModel)]="item.categoryId">
            @for(cat of categories; track cat.id){
            <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>數量</mat-label>
          <input matInput type="number" required [(ngModel)]="item.quantity" min="0">
        </mat-form-field>
      </div>
      <div class="col-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>單位</mat-label>
          <input matInput [(ngModel)]="item.unit" required placeholder="個/瓶">
        </mat-form-field>
      </div>
      <div class="col-4">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>單價</mat-label>
          <input matInput type="number" required [(ngModel)]="item.price" min="0">
          <span matPrefix>$&nbsp;</span>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>安全庫存量</mat-label>
          <input matInput type="number" required [(ngModel)]="item.saveQuantity" min="0">
          <span matPrefix>$&nbsp;</span>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>存放地點</mat-label>
          <mat-select required [(ngModel)]="item.locationId">
            @for(cat of location; track $index){
            <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>購買日期</mat-label>
          <input matInput [matDatepicker]="purchasePicker" required [(ngModel)]="item.purchaseDate" [max]="today">
          <mat-datepicker-toggle matIconSuffix [for]="purchasePicker"></mat-datepicker-toggle>
          <mat-datepicker #purchasePicker></mat-datepicker>

        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>到期日期</mat-label>
          <input matInput [matDatepicker]="expirePicker" required [(ngModel)]="item.expireDate" [min]="minDate">
          <mat-datepicker-toggle matIconSuffix [for]="expirePicker"></mat-datepicker-toggle>
          <mat-datepicker #expirePicker></mat-datepicker>
          <mat-hint>過期前系統會自動發送通知</mat-hint>
        </mat-form-field>
      </div>

      <div class="col-12 mt-2">
        <div class="d-flex align-items-center justify-content-between p-3 rounded-3 bg-light border">
          <div>
            <div class="fw-bold mb-0" [class.text-primary]="item.notify" style="font-size: 14px;">
              開啟到期提醒
            </div>
            <div class="text-muted" style="font-size: 12px;">
              {{ item.notify ? '系統將在物品過期前發送通知' : '目前已暫停此物品的提醒' }}
            </div>
          </div>
          <mat-slide-toggle [(ngModel)]="item.notify" color="primary"></mat-slide-toggle>
        </div>
      </div>


      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>備註事項</mat-label>
          <textarea cdkTextareaAutosize #autosize="cdkTextareaAutosize" cdkAutosizeMinRows="1" cdkAutosizeMaxRows="5"
            matInput rows="3" [(ngModel)]="item.note" placeholder="可以記錄購買地點、口感或保存提醒...">
    </textarea>
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-3">
  <button mat-button (click)="onNoClick()">取消</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="item" [disabled]="!item.name || !item.expireDate"
    (click)="addItemInfo()">
    確認新增
  </button>
</mat-dialog-actions>
