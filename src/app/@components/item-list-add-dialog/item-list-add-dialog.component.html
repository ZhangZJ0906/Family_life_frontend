<h2 mat-dialog-title class="fw-bold text-primary">📦 {{ data.title }}</h2>
<!--TODO 缺少 user 群組 -->
<mat-dialog-content>
  <div class="container-fluid pt-2">
    <div class="row g-3">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>物品名稱</mat-label>
          <input matInput [(ngModel)]="item.name" required placeholder="例如：全脂牛奶">
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>所屬群組</mat-label>
          <mat-select [(ngModel)]="item.groupId">
            @for (g of groupId;track g) {
            <mat-option [value]="g">{{g}}</mat-option>
            }
          </mat-select>
          <mat-hint>選擇該物品存放的群組</mat-hint>
        </mat-form-field>
      </div>

      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>數量</mat-label>
          <input matInput type="number" [(ngModel)]="item.quantity" min="0">
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>單位</mat-label>
          <input matInput [(ngModel)]="item.unit" placeholder="瓶/個/包">
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>分類</mat-label>
          <mat-select [(ngModel)]="item.categoryId">
            @for( cat of data.categories ;track cat.id){
            <mat-option [value]="cat.id">
              {{ cat.name }}
            </mat-option>
            }

          </mat-select>
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>購買價格</mat-label>
          <input matInput type="number" [(ngModel)]="item.price" min="0">
          <span matPrefix>$&nbsp;</span>
        </mat-form-field>
      </div>

      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>到期日</mat-label>
          <input matInput type="date" [(ngModel)]="item.expireDate">
        </mat-form-field>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="p-3">
  <button mat-button (click)="onNoClick()">取消</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="item" [disabled]="!item.name">
    確認新增
  </button>
</mat-dialog-actions>
