<app-topbar></app-topbar>

<main class="page">
  <a class="back-link" routerLink="/shopping-list">返回購物清單</a>

  <section class="page-heading">
    <div>
      <p class="eyebrow">Purchase Items</p>
      <h1>新增購物項目</h1>
    </div>

    <button class="ghost-button" type="button" (click)="loadItems()" [disabled]="isLoading">
      重新整理
    </button>
  </section>

  <section class="add-panel" aria-label="新增購物項目">
    <form class="add-form" (ngSubmit)="addItem()">
      <label class="field item-field">
        <span>項目名稱</span>
        <input
          type="text"
          name="item"
          [(ngModel)]="newItem.item"
          placeholder="例如：牛奶"
          autocomplete="off"
        />
      </label>

      <label class="field quantity-field">
        <span>數量</span>
        <input
          type="number"
          name="quantity"
          [(ngModel)]="newItem.quantity"
          min="1"
          step="1"
        />
      </label>

      <label class="field category-field">
        <span>分類</span>
        <select name="categoryId" [(ngModel)]="newItem.categoryId">
          @for(cat of categories; track cat.id){
            <option [ngValue]="cat.id">{{ cat.name }}</option>
          }

        </select>
      </label>

      <label class="field assignee-field" *ngIf="hasGroup">
        <span>指派給</span>
        <select
          name="assignedUserId"
          [(ngModel)]="newItem.assignedUserId"
          [disabled]="isLoadingMembers || members.length === 0"
        >
          <option *ngIf="isLoadingMembers" [ngValue]="newItem.assignedUserId">
            成員載入中...
          </option>
          <option *ngFor="let member of members; trackBy: trackByMemberId" [ngValue]="member.user_id">
            {{ member.user_name }}
          </option>
        </select>
      </label>

      <div class="form-actions">
        <button class="primary-button" type="submit" [disabled]="isSaving">
          {{ isSaving ? (isEditing ? '儲存中...' : '新增中...') : (isEditing ? '儲存修改' : '新增項目') }}
        </button>

        <button class="ghost-button" type="button" *ngIf="isEditing" (click)="cancelEdit()" [disabled]="isSaving">
          取消
        </button>
      </div>
    </form>

    <p class="form-error" *ngIf="formError">{{ formError }}</p>
  </section>

  <section class="items-panel" aria-label="購物項目列表">
    <div class="panel-header">
      <h2>項目列表</h2>
      <!-- <span>{{ items.length }} 筆</span> -->
    </div>

    <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="state-box" *ngIf="isLoading">項目載入中...</div>

    <div class="state-box" *ngIf="!isLoading && items.length === 0">
      這份清單目前沒有項目，先新增第一個購物項目。
    </div>

    <div class="item-list" *ngIf="!isLoading && items.length > 0">
      <article
        class="item-row"
        *ngFor="let item of items; trackBy: trackByItemId"
        [class.is-checked]="item.check"
      >
        <div class="item-content">
          <strong>{{ item.item }}</strong>
          <small>{{ getCategoryName(item.categoryId) }}</small>
          <small *ngIf="hasGroup">指派給：{{ getMemberName(item.userId) }}</small>
        </div>

        <span class="quantity">x {{ item.quantity }}</span>

        <button class="icon-button" type="button" (click)="editItem(item)" aria-label="修改項目">
          修改
        </button>

        <button class="icon-button" type="button" (click)="deleteItem(item)" aria-label="刪除項目">
          刪除
        </button>
      </article>
    </div>
  </section>
</main>
