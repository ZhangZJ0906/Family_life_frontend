<section class="auth-page">
  <div class="brand-section">
    <img
      class="auth-hero-img"
      src="images/auth-hero.png"
      alt="家庭生活到期管家介紹圖"
    />
  </div>

  <form class="auth-card register-card" (ngSubmit)="register()">
    <div class="form-icon register-icon">
      <mat-icon>person_add</mat-icon>
    </div>

    <h1>註冊</h1>
    <p class="subtitle">建立帳號，開始管理您的生活！</p>

    <mat-form-field class="auth-field" appearance="outline">
      <mat-label>帳號</mat-label>
      <mat-icon matPrefix>person</mat-icon>
      <input
        matInput
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="請輸入姓名"
        required
      />
    </mat-form-field>

    <mat-form-field class="auth-field" appearance="outline">
      <mat-label>Email</mat-label>
      <mat-icon matPrefix>mail</mat-icon>
      <input
        matInput
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="請輸入 Email"
        required
      />
    </mat-form-field>

    <mat-form-field class="auth-field" appearance="outline">
      <mat-label>密碼</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input
        matInput
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="請輸入密碼"
        minlength="6"
        required
      />
      @if (passwordError) {
        <mat-error>{{ passwordError }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="auth-field" appearance="outline">
      <mat-label>確認密碼</mat-label>
      <mat-icon matPrefix>lock_reset</mat-icon>
      <input
        matInput
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="請再次輸入密碼"
        required
      />
      @if (confirmPasswordError) {
        <mat-error>{{ confirmPasswordError }}</mat-error>
      }
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="button"
      class="register-btn"
      (click)="startRegister()"
    >
      註冊
    </button>

    <p class="switch-text">
      已有帳號？
      <a [routerLink]="['/login']">立即登入</a>
    </p>
  </form>
</section>
