



asd
<input type="text">


<div class="container">
  <div class="header-section">
    <h2>物品清單</h2>
    <mat-form-field>
      <mat-label>搜尋物品</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="例如：牛奶" #input>
    </mat-form-field>
  </div>

  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> 物品名稱 </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> 目前數量 </th>
        <td mat-cell *matCellDef="let element">
          {{element.quantity}} <span class="unit-text">{{element.unit}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> 價格 </th>
        <td mat-cell *matCellDef="let element"> {{element.price | currency:'TWD':'symbol':'1.0-0'}} </td>
      </ng-container>

      <ng-container matColumnDef="expireDate">
        <th mat-header-cell *matHeaderCellDef> 到期日 </th>
        <td mat-cell *matCellDef="let element"> {{element.expireDate || '無'}} </td>
      </ng-container>

      <ng-container matColumnDef="notify">
        <th mat-header-cell *matHeaderCellDef> 提醒 </th>
        <td mat-cell *matCellDef="let element">
          <span [style.color]="element.notify ? 'green' : 'gray'">
            {{element.notify ? '開啟' : '關閉'}}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">沒有找到符合的資料 "{{input.value}}"</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="選擇物品頁面">
    </mat-paginator>
  </div>
</div>
