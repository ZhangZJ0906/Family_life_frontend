<div class="container-fluid py-3">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="fw-bold mb-0">家庭記帳系統</h3>
      <small class="text-muted">費用管理 Dashboard</small>
    </div>

    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon class="me-1">add</mat-icon>
      新增支出
    </button>
  </div>

  <!-- SUMMARY -->
  <div class="row g-3 mb-3">

    <div class="col-md-3">
      <div class="card summary-card bg-danger text-white">
        <div class="card-body">
          <div class="label">總支出</div>
          <div class="value">${{ totalExpense() }}</div>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card summary-card bg-primary text-white">
        <div class="card-body">
          <div class="label">本月支出</div>
          <!-- <div class="value">${{ monthlyExpense() }}</div> -->
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card summary-card bg-success text-white">
        <div class="card-body">
          <div class="label">平均每日</div>
          <!-- <div class="value">${{ avgDaily() }}</div> -->
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card summary-card bg-dark text-white">
        <div class="card-body">
          <div class="label">紀錄筆數</div>
          <div class="value">{{ dataSource.data.length }}</div>
        </div>
      </div>
    </div>

  </div>

  <!-- TABLE CARD -->
  <div class="card shadow-sm">

    <!-- TOOLBAR -->
    <div class="card-header bg-white d-flex justify-content-between align-items-center">

      <div class="fw-bold">支出明細</div>

      <div class="d-flex gap-2">

        <!-- 篩選 -->
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>分類</mat-label>
          
          <mat-select (selectionChange)="filterByCategory($event.value)">

            <mat-option [value]="null">全部</mat-option>
            @for (cat of categoryMap; track cat.id) {
              <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <!-- 搜尋 -->
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>搜尋</mat-label>
          <input matInput (input)="applyFilter($event)">
        </mat-form-field>

      </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">

      <table mat-table [dataSource]="dataSource" class="table table-hover align-middle mb-0 big-table">

        <ng-container matColumnDef="expense_date">
          <th mat-header-cell *matHeaderCellDef>日期</th>
          <td mat-cell *matCellDef="let e">{{ e.expenseDate }}</td>
        </ng-container>

        <ng-container matColumnDef="category_id">
          <th mat-header-cell *matHeaderCellDef>分類</th>
          <td mat-cell *matCellDef="let e">
            <span class="badge bg-primary px-3 py-2">
              {{ getCategoryName(e.categoryId) || '未分類' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="note">
          <th mat-header-cell *matHeaderCellDef>備註</th>
          <td mat-cell *matCellDef="let e" class="note">
            {{ e.note || '--' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef>金額</th>
          <td mat-cell *matCellDef="let e" class="price">
            ${{ e.price }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let e">

            <button mat-icon-button color="primary"
              (click)="openEditDialog(e)">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="warn"
              (click)="deleteById(e)">
              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

    </div>

  </div>
</div>
