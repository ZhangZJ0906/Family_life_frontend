<header class="topbar">
  <!-- 左側 Logo -->
  <div class="logo-area" routerLink="/home-page">


  <div class="logo-text">
    <div class="logo-title">拾期日常</div>
    <div class="logo-subtitle">Family Life Manager</div>
  </div>
</div>

  <!-- 手機版選單按鈕 -->
  <button class="menu-toggle" type="button" (click)="toggleMenu()">
    <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

 <!-- 導覽選單 -->
<nav class="top-nav" [class.open]="isMenuOpen">

  <button
    routerLink="/itemList"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>inventory_2</mat-icon>
    <span>物品清單</span>
  </button>

  <button
    routerLink="/shopping-list"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>shopping_cart</mat-icon>
    <span>購物清單</span>
  </button>

  <button
    routerLink="/calendar"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>calendar_month</mat-icon>
    <span>家庭行事曆</span>
  </button>

  <button
    routerLink="/expenses"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>credit_card</mat-icon>
    <span>記帳</span>
  </button>

  <button
    routerLink="/group"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>groups</mat-icon>
    <span>我的群組</span>
  </button>

  <button
    routerLink="/profile"
    routerLinkActive="active"
    (click)="closeMenu()"
  >
    <mat-icon>account_circle</mat-icon>
    <span>個人資料</span>
  </button>

</nav>

  <!-- 右側功能區 -->
  <div class="top-actions">
    <button
      class="icon-btn"
      type="button"
      (click)="openNotifyDialog()"
      [matBadge]="unreadCount"
      matBadgeColor="warn"
      matBadgeSize="large"
      [matBadgeHidden]="unreadCount === 0"
    >
      🔔
    </button>

    <div class="user-avatar">
  <div *ngIf="isAvatarLoading" class="avatar-loading">
    <span class="avatar-spinner"></span>
  </div>

  <ng-container *ngIf="!isAvatarLoading">
    <img
      *ngIf="avatarUrl; else defaultAvatar"
      [src]="getAvatar(avatarUrl)"
      alt="使用者頭像"
    />

    <ng-template #defaultAvatar>
      <mat-icon class="default-avatar-icon">person</mat-icon>
    </ng-template>
  </ng-container>
</div>

    <button class="logout-btn" type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</header>
