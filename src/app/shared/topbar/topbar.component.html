<header class="topbar">

  <!-- 左側 Logo 區 -->
  <div class="logo-area" routerLink="/home-page">
    <img src="images/logo.png" class="logo-img" alt="Logo">
  </div>

  <nav class="top-nav">
    <button routerLink="/food" routerLinkActive="active">新增食材</button>
    <button routerLink="/medicine" routerLinkActive="active">新增藥品</button>
    <button routerLink="/warranty" routerLinkActive="active">新增保固</button>
    <button routerLink="/itemList" routerLinkActive="active">物品清單</button>
    <button routerLink="/shopping-list" routerLinkActive="active">購物清單</button>
    <button routerLink="/calendar" routerLinkActive="active">家庭行事曆</button>
    <button routerLink="/expenses" routerLinkActive="active">記帳</button>
    <button routerLink="/group" routerLinkActive="active">我的群組</button>
    <button routerLink="/profile" routerLinkActive="active">個人資料</button>
  </nav>


  <div class="top-actions">

    <button class="icon-btn"
      (click)="openNotifyDialog()"
      [matBadge]="unreadCount"
      matBadgeColor="warn"
      matBadgeSize="large"
      [matBadgeHidden]="unreadCount === 0"
    >
      🔔
    </button>
    <!-- 右上角使用者頭像 -->
    <div class="user-avatar">

      <!-- 有頭像圖片時顯示圖片 -->
      <img *ngIf="avatarUrl; else defaultAvatar" [src]="avatarUrl" alt="使用者頭像">

      <!-- 沒有頭像圖片時顯示 J -->
      <ng-template #defaultAvatar>
        J
      </ng-template>

    </div>

    <!-- 🔥 新增 logout button -->
    <button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

</header>
