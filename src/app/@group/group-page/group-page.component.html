<div class="layout">


  <!-- Main -->
  <main class="main">

    <app-topbar></app-topbar>

    <!-- Search -->
    <div class="search-box">
      <!-- 左側搜尋 -->
      <div class="search-left">
        <input type="text" placeholder="搜尋群組..." [(ngModel)]="keyword">

        <button
          class="search-btn"
          (click)="searchGroups()"
        >
          🔍
        </button>

      </div>

      <!-- 右側功能按鈕 -->
      <div class="search-actions">

        <button
          class="add-btn"
          (click)="openCreateDialog()"
        >
          ＋
        </button>

        <button
          class="join-btn"
          (click)="joinGroupDialog()"
        >
          <mat-icon>group_add</mat-icon>
        </button>

      </div>
    </div>

    <!-- Group Cards -->
    <div class="card-list">

      <div class="group-card" *ngFor="let group of pagedGroups">

        <!-- 左 -->
        <div class="left">

          <img class="avatar"
               [src]="group.avatar || 'assets/default-avatar.png'">

          <div class="info">
            <div class="name">
              {{ truncateName(group.groupName) }}
            </div>

            <div class="gid">
              GID: {{ group.groupId }}
            </div>
          </div>

        </div>

        <!-- 右 -->
        <div class="right">

          <!-- <button class="btn chat">群組清單</button> -->

          <button class="btn member"
            (click)="openMemberDialog(group, user_id)">
            成員
          </button>

          <button class="btn edit"
            (click)="openUpdateDialog(group, user_id)">
            修改
          </button>

          <button class="btn danger"
            (click)="deleteGroup(group.groupId)">
            解散
          </button>

        </div>

      </div>

    </div>

    <!-- Pagination -->
    <div class="pagination">

      <button (click)="prevPage()" [disabled]="currentPage === 1">‹</button>

      <span>{{ currentPage }} / {{ totalPages }}</span>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages">›</button>

    </div>

  </main>

</div>
