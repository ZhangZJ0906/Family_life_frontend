<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <div>
      <h2>{{ data.group.groupName }}</h2>

      <div class="group-info-row">

        <p class="group-id">
          群組ID：{{ data.group.groupId }}
        </p>

        <div class="invite-code-box">

          <span>
            邀請碼：{{ data.group.inviteCode }}
          </span>

          <button
            class="copy-btn"
            (click)="copyInviteCode()"
          >
            複製
          </button>

        </div>

      </div>
    </div>

    <button
      class="close-btn"
      (click)="closeDialog()"
    >
      ✕
    </button>

  </div>

  <!-- 分類按鈕 -->
  <div class="tab-buttons">

    <button
      [class.active]="selectedTab === 'members'"
      (click)="selectedTab = 'members'"
    >
      成員
    </button>

    <button
      [class.active]="selectedTab === 'waiting'"
      (click)="selectedTab = 'waiting'"
    >
      等待加入
    </button>

  </div>

  <!-- 成員 -->
  <div
    class="member-list"
    *ngIf="selectedTab === 'members'"
  >

    <!-- loading -->
    <div *ngIf="isLoadingMembers" class="loading-table">
      <div class="loading-row" *ngFor="let i of [1,2,3,4]">
        <div class="loading-avatar"></div>
        <div class="loading-text"></div>
      </div>
    </div>

    <!-- data -->
    <div *ngIf="!isLoadingMembers">

    <div
      class="member-card"
      *ngFor="let member of members"
    >

      <div class="member-left">

        <img
          class="avatar"
          [src]="member.avatar || 'assets/default-avatar.png'"
        >

        <div>

          <div class="member-name">
            {{ member.user_name }}
          </div>

          <div class="member-role">
            Email: {{ member.email }}
          </div>

        </div>

      </div>

      <div class="member-actions">

        <!-- <button
          *ngIf="member.publicInventory == 0"
          disabled
          class="check-btn"
        >
          個人清單
        </button> -->

        <!-- <button
          *ngIf="member.publicInventory == 1"
          class="check-btn"
        >
          個人清單
        </button> -->

        <button
          class="remove-btn"
          (click)="removeMember(member)"
        >
          {{ member.user_id != data.userId ? '踢出群組' : '退出群組' }}
        </button>

      </div>

    </div>

    </div>

  </div>

  <!-- 等待加入 -->
  <div
    class="member-list"
    *ngIf="selectedTab === 'waiting'"
  >

    <div *ngIf="isLoadingInvited" class="loading-table">
      <div class="loading-row" *ngFor="let i of [1,2,3]">
        <div class="loading-avatar"></div>
        <div class="loading-text"></div>
      </div>
    </div>

    <div *ngIf="!isLoadingInvited">

    <div
      class="member-card"
      *ngFor="let member of invited_members"
    >

      <div class="member-left">

        <img
          class="avatar"
          [src]="member.avatar || 'assets/default-avatar.png'"
        >

        <div>

          <div class="member-name">
            {{ member.name }}
          </div>

          <div class="member-role">
            Email: {{ member.email }}
          </div>

        </div>

      </div>

    </div>

    </div>

  </div>

  <!-- Footer -->
  <div class="dialog-footer">

    <button
      class="invite-btn"
      (click)="openInviteDialog()"
    >
      邀請成員
    </button>

  </div>

</div>
