<div class="chat-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">

  <div class="chat-header">

    <div>
      💬 {{ groupName }}
    </div>

    <div class="online-badge">
      🟢 {{ onlineCount }}
    </div>

  </div>

  <button class="close-btn" (click)="closeChat()">
    ✕
  </button>

  <div class="chat-body" #scrollBox>

    <!-- 🔥 Loading -->
    <div class="loading-box" *ngIf="isLoadingMessages">
      <div class="spinner"></div>
      <div class="loading-text">載入聊天中...</div>
    </div>

    <div *ngFor="let msg of messages" class="message" [ngClass]="msg.senderId === userId ? 'me' : 'other'">

      <img class="avatar" [src]="getAvatar(msg.senderAvatar) || 'assets/default-avatar.png'" />

      <!-- 圖片 -->
      <div *ngIf="msg.type === 'IMAGE'" class="image-message-wrapper">
        <div class="sender">{{ msg.senderName }}</div>
        <img [src]="getAvatar(msg.imageUrl)" class="chat-image" />
        <div class="time">
          {{ msg.createTime | date:'HH:mm' }}
          <span class="read-status" *ngIf="msg.senderId === userId">
            <ng-container *ngIf="msg.readCount > 0; else sent">已讀 {{ msg.readCount }}</ng-container>
            <ng-template #sent>已送出</ng-template>
          </span>
        </div>
      </div>

      <!-- text -->
      <div *ngIf="msg.type !== 'IMAGE'" class="bubble">
        <div class="sender">{{ msg.senderName }}</div>
        <div class="content">{{ msg.message }}</div>
        <div class="time">
          {{ msg.createTime | date:'HH:mm' }}
          <span class="read-status" *ngIf="msg.senderId === userId">
            <ng-container *ngIf="msg.readCount > 0; else sent">已讀 {{ msg.readCount }}</ng-container>
            <ng-template #sent>已送出</ng-template>
          </span>
        </div>
      </div>

    </div>

  </div>

  <div class="chat-footer">

    <!-- 📎 圖片按鈕 -->
    <label class="img-btn">
      📷
      <input type="file" hidden (change)="onImageSelected($event)">
    </label>


    <input [(ngModel)]="message" placeholder="輸入訊息...">

    <button (click)="sendMessage()">
      發送
    </button>

  </div>

</div>
