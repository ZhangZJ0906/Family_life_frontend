<div class="chat-container" cdkDrag cdkDragRootElement=".cdk-overlay-pane">

  <div class="chat-header">

    <div>
      💬 {{ groupName }}
    </div>

    <div class="online-badge">
      🟢 {{ onlineCount }}
    </div>

  </div>

  <button class="close-btn" (click)="closeChat()">
    ✕
  </button>

  <div class="chat-body" #scrollBox>

    <!-- 🔥 Loading -->
    <div class="loading-box" *ngIf="isLoadingMessages">
      <div class="spinner"></div>
      <div class="loading-text">載入聊天中...</div>
    </div>

    <div
      *ngFor="let msg of messages"
      class="message"
      [ngClass]="msg.senderId === userId ? 'me' : 'other'"
    >

      <img
        class="avatar"
        [src]="msg.senderAvatar || 'assets/default-avatar.png'"
      />

      <div class="bubble">

        <div class="sender">
          {{ msg.senderName }}
        </div>

        <div class="content">
          {{ msg.message }}
        </div>

        <!-- 🔥 圖片 -->
        <img
          *ngIf="msg.type === 'IMAGE'"
          [src]="msg.imageUrl"
          class="chat-image"
        />

        <div class="time">
          {{ msg.createTime | date:'HH:mm' }}

          <!-- ✔ 已讀 -->
          <span class="read-status" *ngIf="msg.senderId === userId">
            <ng-container *ngIf="msg.readCount > 0; else sent">
              已讀 {{ msg.readCount }}
            </ng-container>

            <ng-template #sent>
              已送出
            </ng-template>
          </span>
        </div>

      </div>

    </div>

  </div>

  <div class="chat-footer">

    <!-- 📎 圖片按鈕 -->
    <label class="img-btn">
      📷
      <input type="file" hidden (change)="onImageSelected($event)">
    </label>


    <input
      [(ngModel)]="message"
      placeholder="輸入訊息..."
    >

    <button
      (click)="sendMessage()"
    >
      發送
    </button>

  </div>

</div>
